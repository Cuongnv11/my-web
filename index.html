<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-overlay: rgba(10, 10, 15, 0.75);
            --card-bg: rgba(20, 22, 32, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-glow: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #a0a5b5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #050508;
            color: var(--text-primary);
        }

        /* HÌNH NỀN */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://i.ibb.co/ks6gKYwh/IMG-0663.jpg') no-repeat center center/cover;
            filter: blur(8px) brightness(0.6);
            transform: scale(1.05);
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-overlay);
            z-index: 1;
        }

        /* MÀN HÌNH CHỜ (CLICK TO ENTER) */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 99999;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        #entry-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* CONTAINER THẺ 3D */
        .wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            perspective: 1000px;
            padding: 40px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            text-align: center;
        }

        /* AVATAR */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            display: block;
        }

        .avatar-container:hover .avatar-img {
            transform: scale(1.05) rotate(3deg);
        }

        /* GALLERY HÌNH ÁNH */
        .gallery-section {
            margin-bottom: 24px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: block;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }

        .gallery-item:hover img {
            transform: scale(1.15);
        }

        /* LINK BARS */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .custom-link-btn {
            display: block;
            height: 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .custom-link-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .audio-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(20, 22, 32, 0.85);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            z-index: 99;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
            width: 44px;
            height: 44px;
        }

        .audio-widget:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .profile-card { padding: 24px 18px; }
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
            .gallery-item { height: 75px; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div id="entry-screen"></div>

    <div class="wrapper">
        <div class="profile-card" id="card">
            
            <div class="avatar-container">
                <a href="https://ibb.co/9k39nR1q" target="_blank">
                    <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="" class="avatar-img">
                </a>
            </div>

            <div class="gallery-section">
                <div class="gallery-grid">
                    <a href="https://ibb.co/9k39nR1q" target="_blank" class="gallery-item">
                        <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="">
                    </a>
                    <a href="https://ibb.co/9k39nR1q" target="_blank" class="gallery-item">
                        <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="">
                    </a>
                    <a href="https://ibb.co/9k39nR1q" target="_blank" class="gallery-item">
                        <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="">
                    </a>
                </div>
            </div>

            <div class="links-list">
                <a href="#" class="custom-link-btn"></a>
                <a href="#" class="custom-link-btn"></a>
                <a href="#" class="custom-link-btn"></a>
            </div>

        </div>
    </div>

    <div class="audio-widget" id="audio-toggle"></div>

    <script>
        const entryScreen = document.getElementById('entry-screen');

        entryScreen.addEventListener('click', () => {
            entryScreen.classList.add('fade-out');
        });

        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
