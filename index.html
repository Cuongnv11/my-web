<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - hwxnvc</title>
    
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-overlay: rgba(10, 10, 15, 0.75);
            --card-bg: rgba(20, 22, 32, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-glow: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #a0a5b5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #050508;
            color: var(--text-primary);
        }

        /* HÌNH NỀN GỐC CỦA BẠN */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://i.ibb.co/ks6gKYwh/IMG-0663.jpg') no-repeat center center/cover;
            filter: blur(8px) brightness(0.6);
            transform: scale(1.05);
            z-index: 0;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-overlay);
            z-index: 1;
        }

        /* MÀN HÌNH CHỜ (CLICK TO ENTER) */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        #entry-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .entry-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: lowercase;
            color: #ffffff;
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.03); text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        }

        /* CONTAINER THẺ 3D */
        .wrapper {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            perspective: 1000px;
            padding: 40px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            text-align: center;
        }

        /* AVATAR */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .avatar-container:hover .avatar-img {
            transform: scale(1.05) rotate(3deg);
        }

        .username {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .badges-row {
            display: inline-flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .badge-icon {
            color: #b5bac1;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .badge-icon:hover {
            color: #ffffff;
            transform: scale(1.2);
        }

        .bio-text {
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 22px;
            margin-bottom: 20px;
        }

        /* GALLERY HÌNH ÁNH */
        .gallery-section {
            margin-bottom: 24px;
            text-align: left;
        }

        .gallery-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.15);
        }

        /* LINK SOCIALS */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .custom-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .custom-link-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-left i {
            font-size: 18px;
        }

        .audio-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(20, 22, 32, 0.85);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            z-index: 99;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .audio-widget:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 480px) {
            .profile-card { padding: 24px 18px; }
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
            .gallery-item { height: 75px; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <div id="entry-screen">
        <div class="entry-text">click to enter...</div>
    </div>

    <div class="wrapper">
        <div class="profile-card" id="card">
            
            <!-- AVATAR CỦA BẠN -->
            <div class="avatar-container">
                <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="Avatar" class="avatar-img">
            </div>

            <h1 class="username">hwxnvc</h1>

            <div class="badges-row">
                <i class="fa-solid fa-bolt badge-icon" title="Nitro"></i>
                <i class="fa-solid fa-shield-halved badge-icon" title="Badge 2"></i>
                <i class="fa-solid fa-code badge-icon" title="Developer"></i>
                <i class="fa-solid fa-gem badge-icon" title="Booster"></i>
            </div>

            <div class="bio-text" id="typewriter"></div>

            <!-- GALLERY CỦA BẠN -->
            <div class="gallery-section">
                <div class="gallery-title">
                    <i class="fa-regular fa-images"></i>
                    <span>My Gallery</span>
                </div>
                <div class="gallery-grid">
                    <div class="gallery-item">
                        <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="Photo 1">
                    </div>
                    <div class="gallery-item">
                        <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="Photo 2">
                    </div>
                    <div class="gallery-item">
                        <img src="https://i.ibb.co/ks6gKYwh/IMG-0663.jpg" alt="Photo 3">
                    </div>
                </div>
            </div>

            <div class="links-list">
                <a href="https://discord.gg/your-invite-code" target="_blank" class="custom-link-btn">
                    <div class="link-left">
                        <i class="fa-brands fa-discord" style="color: #5865f2;"></i>
                        <span>Discord Community</span>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; opacity: 0.5;"></i>
                </a>

                <a href="https://instagram.com" target="_blank" class="custom-link-btn">
                    <div class="link-left">
                        <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
                        <span>Instagram Profile</span>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; opacity: 0.5;"></i>
                </a>

                <a href="https://github.com" target="_blank" class="custom-link-btn">
                    <div class="link-left">
                        <i class="fa-brands fa-github"></i>
                        <span>GitHub Projects</span>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="font-size: 12px; opacity: 0.5;"></i>
                </a>
            </div>

        </div>
    </div>

    <div class="audio-widget" id="audio-toggle">
        <i class="fa-solid fa-music"></i>
        <span id="audio-status">Audio Off</span>
    </div>

    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/7b7r1y.mp3" type="audio/mpeg">
    </audio>

    <script>
        const entryScreen = document.getElementById('entry-screen');
        const bgMusic = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        const audioStatus = document.getElementById('audio-status');
        let isPlaying = false;

        entryScreen.addEventListener('click', () => {
            entryScreen.classList.add('fade-out');
            bgMusic.play().then(() => {
                isPlaying = true;
                audioStatus.textContent = "Audio Playing";
            }).catch(() => {
                audioStatus.textContent = "Click to Play";
            });
        });

        audioToggle.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                audioStatus.textContent = "Muted";
                isPlaying = false;
            } else {
                bgMusic.play();
                audioStatus.textContent = "Audio Playing";
                isPlaying = true;
            }
        });

        const bioPhrases = ["designer & developer", "welcome to my profile", "guns.lol aesthetic layout"];
        let phraseIdx = 0;
        let charIdx = 0;
        const typewriterEl = document.getElementById("typewriter");

        function typeBio() {
            if (charIdx < bioPhrases[phraseIdx].length) {
                typewriterEl.textContent += bioPhrases[phraseIdx].charAt(charIdx);
                charIdx++;
                setTimeout(typeBio, 80);
            } else {
                setTimeout(eraseBio, 2000);
            }
        }

        function eraseBio() {
            if (charIdx > 0) {
                typewriterEl.textContent = bioPhrases[phraseIdx].substring(0, charIdx - 1);
                charIdx--;
                setTimeout(eraseBio, 40);
            } else {
                phraseIdx = (phraseIdx + 1) % bioPhrases.length;
                setTimeout(typeBio, 300);
            }
        }

        document.addEventListener("DOMContentLoaded", () => setTimeout(typeBio, 800));

        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
    </script>
</body>
</html>
