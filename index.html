<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hwxnvc | Personal Site</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES (Phần trang trí) --- */
        
        :root {
            --primary-color: #7289da; /* Màu Discord */
            --bg-color: #0d1117;     /* Màu nền tối kiểu GitHub */
            --text-color: #c9d1d9;
            --card-bg: rgba(255, 255, 255, 0.05); /* Nền kính mờ */
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; /* Giữ vòng tròn trang trí */
        }

        /* --- Vòng tròn trang trí nền --- */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
        }
        .circle-1 {
            width: 300px; height: 300px;
            background: rgba(114, 137, 218, 0.3);
            top: -50px; left: -50px;
        }
        .circle-2 {
            width: 400px; height: 400px;
            background: rgba(10, 191, 255, 0.2);
            bottom: -100px; right: -50px;
        }

        /* --- Container chính (Glassmorphism) --- */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px); /* Hiệu ứng mờ kính */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px); /* Hiệu ứng nổi lên khi di chuột */
        }

        /* --- Avatar --- */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--border-color);
        }
        
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background-color: #23a55a; /* Màu Online */
            border-radius: 50%;
            border: 3px solid var(--bg-color);
        }

        /* --- Text --- */
        .name {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 15px;
            font-weight: 300;
            color: #8b949e;
            margin-bottom: 25px;
            font-style: italic;
        }

        /* --- Social Links (Phần quan trọng) --- */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        /* Style riêng cho từng nút */
        .btn-discord {
            background-color: var(--primary-color);
            color: #fff;
        }
        .btn-discord:hover {
            background-color: #5b6eae;
            transform: scale(1.02);
        }

        .btn-github {
            background-color: #24292f;
            color: #fff;
            border-color: #444;
        }
        .btn-github:hover {
            background-color: #333;
            transform: scale(1.02);
        }

        .btn-bluesky {
            background-color: #0085ff; /* Màu Bluesky */
            color: #fff;
        }
        .btn-bluesky:hover {
            background-color: #0070d6;
            transform: scale(1.02);
        }

        /* Icon size */
        .social-btn i {
            font-size: 20px;
        }

    </style>
</
