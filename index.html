<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Canvas</title>
    <style>
        /* --- RESET & NỀN CANVAS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f1ea; /* Tone màu giấy vẽ vintage */
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.04) 1px, #f4f1ea 0);
            background-size: 20px 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        #art-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- MỖI KHUNG ẢNH xuất hiện --- */
        .art-item {
            position: absolute;
            padding: 10px 10px 14px 10px;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.08),
                0 2px 6px rgba(0, 0, 0, 0.05);
            /* Chuyển động mượt mà khi xuất hiện và biến mất */
            opacity: 0;
            transform: scale(0.4);
            transition: 
                opacity 0.8s ease, 
                transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease;
            cursor: pointer;
        }

        /* Trạng thái ảnh đã xuất hiện hoàn toàn */
        .art-item.visible {
            opacity: 1;
        }

        /* Trạng thái ảnh mờ dần và biến mất */
        .art-item.fade-out {
            opacity: 0 !important;
            transform: scale(0.6) !important;
        }

        /* Hiệu ứng khi di chuột vào ảnh */
        .art-item:hover {
            transform: scale(1.1) rotate(0deg) !important;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.18),
                0 6px 12px rgba(0, 0, 0, 0.1);
            z-index: 99999 !important;
        }

        .art-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
            pointer-events: none;
            filter: saturate(0.9) contrast(1.05);
        }
    </style>
</head>
<body>

    <div id="art-canvas"></div>

    <script>
        const canvas = document.getElementById('art-canvas');
        
        // --- CẤU HÌNH THỜI GIAN & SỐ LƯỢNG ---
        const MAX_IMAGES = 14;        // Số lượng ảnh tối đa xuất hiện trên màn hình cùng lúc
        const SPAWN_INTERVAL = 2000;  // Thời gian tạo ảnh mới (2000ms = 2 giây)
        
        let zIndexCounter = 10;

        // Kho seed ảnh nghệ thuật
        const imageSeeds = [
            1025, 1062, 1069, 1080, 1084, 1015, 1021, 1035, 1040, 1050, 
            1060, 1074, 1082, 1005, 1011, 1027, 1039, 1043, 1052, 1056, 
            1068, 1076, 1081, 1083, 1024, 1018, 1012, 1002, 1004, 1006
        ];

        function createRandomImage() {
            const item = document.createElement('div');
            item.classList.add('art-item');

            // Kích thước ngẫu nhiên (180px -> 260px)
            const width = Math.floor(Math.random() * 80) + 180;
            const height = Math.floor(width * (Math.random() * 0.4 + 1.1));

            // Tọa độ ngẫu nhiên trên màn hình
            const posX = Math.random() * (window.innerWidth - width - 60) + 30;
            const posY = Math.random() * (window.innerHeight - height - 60) + 30;
            const rotation = (Math.random() * 40 - 20).toFixed(1); // Góc xoay -20 đến +20 độ

            item.style.width = `${width}px`;
            item.style.height = `${height}px`;
            item.style.left = `${posX}px`;
            item.style.top = `${posY}px`;
            item.style.zIndex = ++zIndexCounter;

            // Chọn ảnh ngẫu nhiên từ kho seed
            const randomSeed = imageSeeds[Math.floor(Math.random() * imageSeeds.length)];
            const img = document.createElement('img');
            img.src = `https://picsum.photos/id/${randomSeed}/${width}/${height}`;
            img.alt = 'Canvas Art';

            item.appendChild(img);

            // Bấm vào ảnh để đưa lên trên cùng
            item.addEventListener('click', () => {
                zIndexCounter++;
                item.style.zIndex = zIndexCounter;
            });

            canvas.appendChild(item);

            // Kích hoạt animation xuất hiện (fade-in + phóng to)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    item.classList.add('visible');
                    item.style.transform = `scale(1) rotate(${rotation}deg)`;
                });
            });

            // Tự động dọn dẹp ảnh cũ khi vượt quá MAX_IMAGES
            const currentItems = canvas.querySelectorAll('.art-item:not(.fade-out)');
            if (currentItems.length > MAX_IMAGES) {
                const oldestItem = currentItems[0];
                oldestItem.classList.remove('visible');
                oldestItem.classList.add('fade-out');

                // Xóa hẳn phần tử ra khỏi DOM sau khi hoàn tất hiệu ứng mờ
                setTimeout(() => {
                    if (oldestItem.parentNode) {
                        oldestItem.parentNode.removeChild(oldestItem);
                    }
                }, 800);
            }
        }

        // Tạo sẵn 4 bức ảnh đầu tiên khi tải trang
        for (let i = 0; i < 4; i++) {
            setTimeout(createRandomImage, i * 400);
        }

        // VÒNG LẶP LIÊN TỤC: Tạo 1 ảnh mới mỗi vài giây
        setInterval(createRandomImage, SPAWN_INTERVAL);
    </script>
</body>
</html>
