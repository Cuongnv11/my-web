<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <style>
        /* --- CSS RESET & CANVAS BACKGROUND --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f1ea; /* Màu nền giấy Canvas/Nỉ ấm áp */
            /* Tạo vân nỉ mờ nhẹ cho cảm giác như mặt tranh vẽ */
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.04) 1px, #f4f1ea 0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- CANVAS CONTAINER --- */
        #art-canvas {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* --- MỖI KHUNG ẢNH (ART FRAME) --- */
        .art-item {
            position: absolute;
            padding: 12px 12px 16px 12px;
            background: #ffffff;
            border-radius: 4px;
            /* Hiệu ứng bóng đổ chân thực như ảnh dán trên tường */
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.08),
                0 2px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), 
                        box-shadow 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            will-change: transform;
            animation: floatGently 6s ease-in-out infinite alternate;
        }

        /* Hiệu ứng di chuột vào khung ảnh */
        .art-item:hover {
            transform: scale(1.08) rotate(0deg) !important;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.18),
                0 6px 12px rgba(0, 0, 0, 0.1);
            z-index: 9999 !important;
        }

        /* Hình ảnh bên trong khung */
        .art-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
            pointer-events: none;
            filter: saturate(0.9) contrast(1.05); /* Tối ưu tông màu vintage nghệ thuật */
        }

        /* Animation chuyển động bồng bềnh nhẹ nhàng */
        @keyframes floatGently {
            0% {
                margin-top: 0px;
            }
            100% {
                margin-top: -10px;
            }
        }
    </style>
</head>
<body>

    <!-- Container cho các bức ảnh -->
    <div id="art-canvas"></div>

    <script>
        // --- JAVASCRIPT TẠO ẢNH NGẪU NHIÊN ---
        const canvas = document.getElementById('art-canvas');
        
        // Số lượng bức ảnh trang trí hiển thị trên Canvas
        const totalImages = 12; 

        // Danh sách các seed ảnh nghệ thuật trừu tượng/kiến trúc/thiên nhiên
        const imageSeeds = [
            1025, 1062, 1069, 1080, 1084, 
            1015, 1021, 1035, 1040, 1050, 
            1060, 1074, 1082, 1005, 1011
        ];

        let maxZIndex = 10;

        function renderCanvas() {
            canvas.innerHTML = ''; // Làm sạch canvas

            for (let i = 0; i < totalImages; i++) {
                const item = document.createElement('div');
                item.classList.add('art-item');

                // Kích thước ngẫu nhiên cho từng ảnh (từ 180px đến 280px)
                const width = Math.floor(Math.random() * 100) + 180;
                const height = Math.floor(width * (Math.random() * 0.4 + 1.1)); // Tỷ lệ dọc tùy chỉnh

                // Vị trí ngẫu nhiên trong màn hình (tránh tràn viền quá nhiều)
                const posX = Math.random() * (window.innerWidth - width - 60) + 30;
                const posY = Math.random() * (window.innerHeight - height - 60) + 30;

                // Góc nghiêng ngẫu nhiên (-25 độ đến +25 độ)
                const rotation = (Math.random() * 50 - 25).toFixed(1);

                // Thời gian animation bồng bềnh ngẫu nhiên
                const floatDuration = (Math.random() * 3 + 4).toFixed(1);
                const floatDelay = (Math.random() * 2).toFixed(1);

                // Thiết lập Style cho phần tử
                item.style.width = `${width}px`;
                item.style.height = `${height}px`;
                item.style.left = `${posX}px`;
                item.style.top = `${posY}px`;
                item.style.transform = `rotate(${rotation}deg)`;
                item.style.zIndex = Math.floor(Math.random() * 20);
                item.style.animationDuration = `${floatDuration}s`;
                item.style.animationDelay = `${floatDelay}s`;

                // Tạo thẻ <img> lấy ảnh nghệ thuật ngẫu nhiên
                const img = document.createElement('img');
                const seed = imageSeeds[i % imageSeeds.length];
                img.src = `https://picsum.photos/id/${seed}/${width}/${height}`;
                img.alt = 'Art Canvas Item';

                item.appendChild(img);

                // Sự kiện khi nhấp chuột vào ảnh: Nổi lên trên cùng
                item.addEventListener('click', () => {
                    maxZIndex++;
                    item.style.zIndex = maxZIndex;
                });

                canvas.appendChild(item);
            }
        }

        // Khởi chạy khi tải trang
        window.addEventListener('DOMContentLoaded', renderCanvas);

        // Tự động sắp xếp lại khi thay đổi kích thước cửa sổ
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(renderCanvas, 300);
        });
    </script>
</body>
</html>
