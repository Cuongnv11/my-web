<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hwxnvc</title>
    
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #08080c;
            --accent-discord: #5865f2;
            --accent-glow: rgba(88, 101, 242, 0.4);
            --card-bg: rgba(15, 17, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #9a9eab;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        /* --- MÀN HÌNH CHỜ (CLICK TO ENTER) --- */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 8, 12, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        #entry-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .entry-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 20px var(--accent-glow);
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); text-shadow: 0 0 30px var(--accent-discord); }
        }

        /* --- CANVAS HẠT NỀN (BACKGROUND PARTICLES) --- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- CONTAINER KHUNG THẺ 3D --- */
        .main-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            perspective: 1000px;
            padding: 20px;
        }

        /* --- PROFILE CARD (GLASSMORPHISM) --- */
        .profile-card {
            width: 100%;
            max-width: 410px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            text-align: center;
        }

        /* --- AVATAR & STATUS --- */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            background-color: #23a55a; /* Discord Green Online */
            border-radius: 50%;
            border: 4px solid #0f111a;
            box-shadow: 0 0 12px #23a55a;
        }

        /* --- USERNAME & BADGES --- */
        .username-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .badges-container {
            display: inline-flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .badge-item {
            color: #b5bac1;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .badge-item:hover {
            color: #ffffff;
            transform: translateY(-2px) scale(1.1);
        }

        /* --- BIO CHỮ CHẠY (TYPEWRITER) --- */
        .bio-text {
            font-size: 14px;
            color: var(--text-secondary);
            min-height: 22px;
            margin-bottom: 24px;
            font-weight: 400;
        }

        /* --- NÚT DISCORD LINK (MAIN CTA) --- */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 25px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 16px;
        }

        .discord-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(88, 101, 242, 0.6);
            filter: brightness(1.1);
        }

        /* --- CÁC MẠNG XÃ HỘI PHỤ (SOCIAL GRID) --- */
        .socials-row {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 18px;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .social-icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }

        /* --- NÚT ĐIỀU KHIỂN NHẠC GÓC DƯỚI --- */
        .audio-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 17, 26, 0.85);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
            z-index: 99;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        .audio-widget:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .audio-widget i {
            color: var(--accent-discord);
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .profile-card { padding: 26px 20px; }
            .username-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ (Click to Enter) -->
    <div id="entry-screen">
        <div class="entry-text">[ Click to Enter ]</div>
    </div>

    <!-- Canvas Hạt nền -->
    <canvas id="bg-canvas"></canvas>

    <!-- Khung hiển thị Bio chính -->
    <div class="main-wrapper">
        <div class="profile-card" id="card">
            
            <!-- Avatar & Trạng thái -->
            <div class="avatar-wrapper">
                <!-- Thay link ảnh avatar vào đây -->
                <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="hwxnvc avatar" class="avatar-img">
                <div class="status-dot" title="Online"></div>
            </div>

            <!-- Tên Username -->
            <h1 class="username-title">hwxnvc</h1>

            <!-- Huy hiệu Badges -->
            <div class="badges-container">
                <i class="fa-solid fa-bolt badge-item" title="Nitro"></i>
                <i class="fa-solid fa-shield-halved badge-item" title="HypeSquad"></i>
                <i class="fa-solid fa-code badge-item" title="Developer"></i>
                <i class="fa-solid fa-gem badge-item" title="Booster"></i>
            </div>

            <!-- Bio gõ chữ tự động -->
            <div class="bio-text" id="typewriter"></div>

            <!-- Nút chính Liên kết Discord -->
            <!-- LƯU Ý: Thay link Discord Server hoặc User của bạn vào href dưới đây -->
            <a href="https://discord.gg/your-invite-code" target="_blank" class="discord-btn">
                <i class="fa-brands fa-discord"></i>
                <span>Connect on Discord</span>
            </a>

            <!-- Mạng xã hội phụ -->
            <div class="socials-row">
                <a href="https://hwxnvc.dev" target="_blank" class="social-icon-btn" title="Website">
                    <i class="fa-solid fa-globe"></i>
                </a>
                <a href="https://bsky.app/profile/hwxnvc.bsky.social" target="_blank" class="social-icon-btn" title="Bluesky">
                    <i class="fa-solid fa-cloud"></i>
                </a>
                <a href="https://github.com/hwxnvc" target="_blank" class="social-icon-btn" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- Điều khiển nhạc nền -->
    <div class="audio-widget" id="audio-toggle">
        <i class="fa-solid fa-music"></i>
        <span id="audio-status">Audio Off</span>
    </div>

    <!-- Bài hát mp3 ẩn (Thay link mp3 của bạn vào src) -->
    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/7b7r1y.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 1. MÀN HÌNH CHỜ & TỰ ĐỘNG PHÁT NHẠC ---
        const entryScreen = document.getElementById('entry-screen');
        const bgMusic = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        const audioStatus = document.getElementById('audio-status');
        let isPlaying = false;

        entryScreen.addEventListener('click', () => {
            entryScreen.classList.add('fade-out');
            bgMusic.play().then(() => {
                isPlaying = true;
                audioStatus.textContent = "Audio On";
            }).catch(() => {
                audioStatus.textContent = "Click to Play";
            });
        });

        audioToggle.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                audioStatus.textContent = "Muted";
                isPlaying = false;
            } else {
                bgMusic.play();
                audioStatus.textContent = "Audio On";
                isPlaying = true;
            }
        });

        // --- 2. CHỮ CHẠY TỰ ĐỘNG (TYPEWRITER) ---
        const bioPhrases = ["Discord Enthusiast", "hwxnvc.dev", "Building connections...", "Welcome to my space"];
        let phraseIdx = 0;
        let charIdx = 0;
        const typewriterEl = document.getElementById("typewriter");

        function typeBio() {
            if (charIdx < bioPhrases[phraseIdx].length) {
                typewriterEl.textContent += bioPhrases[phraseIdx].charAt(charIdx);
                charIdx++;
                setTimeout(typeBio, 80);
            } else {
                setTimeout(eraseBio, 2000);
            }
        }

        function eraseBio() {
            if (charIdx > 0) {
                typewriterEl.textContent = bioPhrases[phraseIdx].substring(0, charIdx - 1);
                charIdx--;
                setTimeout(eraseBio, 40);
            } else {
                phraseIdx = (phraseIdx + 1) % bioPhrases.length;
                setTimeout(typeBio, 300);
            }
        }

        document.addEventListener("DOMContentLoaded", () => setTimeout(typeBio, 800));

        // --- 3. THẺ NGHIÊNG 3D (3D TILT EFFECT) ---
        const card = document.getElementById('card');

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth < 768) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- 4. HẠT CHUYỂN ĐỘNG NỀN (BACKGROUND STARFIELD) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 70; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.8 + 0.2,
                    speed: Math.random() * 0.4 + 0.1,
                    alpha: Math.random()
                });
            }
        }

        function renderStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.y -= s.speed;
                if (s.y < 0) s.y = canvas.height;

                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        renderStars();
    </script>
</body>
</html>
